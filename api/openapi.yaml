openapi: 3.0.3

# The contract of nexusd's REST API, and the input of oapi-codegen. Each feature's
# rest package generates its own models and its ServerInterface from the operations
# carrying its tag (see the oapi-codegen.yaml beside each package), so this file
# and the routes cannot disagree: a route exists because an operation here does.
#
# Edit this file, run `make generate`, then implement the new method. The
# generated *.gen.go files are committed and CI fails if they are stale.
#
# Not described here: the Telegram, Zalo and email webhooks
# (POST /v1/webhooks/{telegram,zalo,email}/{tenant_id}). They authenticate with a
# per-tenant secret or an HMAC over the raw body, not a bearer token, and are
# served outside the REST kit.
#
# Errors are plain text, not JSON: the body is a one-line message (a 500 never
# carries the cause; it is logged, and the client gets "<operation>: internal
# error").

info:
  title: Nexus Agent REST API
  version: 1.0.0
  description: >-
    Start, watch and steer agent runs; decide the approvals they wait on; and
    read a session's content under an audited grant. Every route except the
    probes needs a bearer token, and everything a token reaches is scoped to its
    tenant.

servers:
  - url: http://localhost:8085
    description: nexusd as started by `make run`

security:
  - bearerAuth: []

tags:
  - name: runs
    description: Start a run, read it back and stream its events.
  - name: run-control
    description: Cancel, steer, tighten or fork a run.
  - name: approvals
    description: The tool calls waiting on a person, and the decision on each.
  - name: content-access
    description: Audited access to a session's plaintext outside its own user.
  - name: ops
    description: Probes and metrics. Served by nexusd itself, outside the REST kit, so no code is generated for them.

paths:
  /v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a run
      description: >-
        Admits a session and starts a one-task run, answering 202 once it is
        accepted; the run proceeds on a queue worker. Follow it with
        `GET /v1/runs/{id}/events`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: The run is accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Read a run's status
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The run's status. `terminal_reason` is absent until the run settles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}/events:
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Stream a run's events (Server-Sent Events)
      description: >-
        The run's event log as Server-Sent Events: the history is replayed
        first, then live events and `delta` previews follow until the `terminal`
        event, when the server closes the stream.


        Each frame is `event: <name>` / `data: <json>`. The name of a durable
        event is its `type` and its data is a `RunEvent`; a `delta` frame is a
        best-effort `RunDelta` preview that is never replayed; an `error` frame
        is `{"error": "<message>"}` and ends the stream. `body` is the decrypted
        payload and is shown only to the run's own user; a `thought` event never
        carries one.


        A conversational run does not emit `terminal` while it waits for the
        next message, so its stream stays open until the client closes it.
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RunEvent'
                  - $ref: '#/components/schemas/RunDelta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sessions:
    get:
      tags: [runs]
      operationId: listSessions
      summary: List the caller's own sessions
      description: >-
        The calling user's root sessions, newest first, capped at 200: the data
        a session sidebar needs and no more.
      responses:
        '200':
          description: The sessions, an empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}/cancel:
    post:
      tags: [run-control]
      operationId: cancelRun
      summary: Cancel a run
      description: >-
        Aborts the run. A pending approval or input request on a suspended
        session is released first. Cancelling a run that has already completed
        or failed is a no-op that still answers 200, so a second call is
        harmless.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRunRequest'
      responses:
        '200':
          description: The run is aborted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}/steer:
    post:
      tags: [run-control]
      operationId: steerRun
      summary: Send a message to a run
      description: >-
        Delivers a message to the run. A conversational session paused awaiting
        the next message is continued in place (the message is appended and the
        continuation queued for a worker); a run that is mid-turn is steered. An
        open event stream picks the continuation up live.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteerRunRequest'
      responses:
        '200':
          description: The message is delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SteerRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}/autonomy:
    post:
      tags: [run-control]
      operationId: tightenAutonomy
      summary: Tighten a run's autonomy
      description: >-
        Moves the session's autonomy toward `read_only`: `autonomous` ->
        `supervised` -> `read_only`. The ratchet only turns one way, so a target
        looser than the current level is refused with 400; the current level
        itself is accepted. The change and the event that records it commit
        together.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TightenAutonomyRequest'
      responses:
        '200':
          description: The autonomy level now in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TightenAutonomyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/runs/{id}/fork:
    post:
      tags: [run-control]
      operationId: forkRun
      summary: Fork a run at an earlier event
      description: >-
        Creates a new session from the history of the run up to and including
        `at_seq`. External effects are disabled in the fork (its autonomy is
        pinned to `read_only`), it inherits no approvals, and it has its own
        budget and audit chain.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkRunRequest'
      responses:
        '200':
          description: The new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List the approvals waiting on a person
      description: >-
        The tenant's pending approvals. An approval exists only when a
        `supervised` run proposes a tool call with a non-read-only effect.
      responses:
        '200':
          description: The pending approvals, an empty array when there are none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/approvals/{id}:
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Read one approval
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: The approval with its decision-ready `context`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/approvals/{id}/grant:
    post:
      tags: [approvals]
      operationId: grantApproval
      summary: Grant an approval
      description: >-
        Approves the tool call, as proposed or with the approver's own
        substitution for its input (`modified_input`, for example changing the
        recipient at grant time; it re-binds the approval's digest). The body is
        optional. The decision is durable when this answers; the run resumes
        asynchronously on a queue worker.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantApprovalRequest'
      responses:
        '202':
          description: The decision is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/approvals/{id}/deny:
    post:
      tags: [approvals]
      operationId: denyApproval
      summary: Deny an approval
      description: >-
        Refuses the tool call. `reason` is optional, and so is the whole body.
        The run resumes on a queue worker to end under `permission_denied`.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DenyApprovalRequest'
      responses:
        '202':
          description: The decision is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{id}/content-access-grants:
    post:
      tags: [content-access]
      operationId: requestContentAccessGrant
      summary: Grant a user access to a session's content
      description: >-
        Grants `grantee_id` expiring, audited access to the plaintext of the
        session. This is the only path to a run's content outside the run's own
        user, and every grant and every read produces its own audit receipt.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestGrantRequest'
      responses:
        '201':
          description: The grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/sessions/{id}/content-access-grants/read:
    get:
      tags: [content-access]
      operationId: readUnderContentAccessGrant
      summary: Read a session's content under a grant
      description: >-
        Reads the session's content as the calling user, who must be the grantee
        of a valid grant: "show me what I was granted", never what someone else
        was.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session's events, decrypted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrantedEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      tags: [ops]
      operationId: getHealthz
      summary: Liveness probe
      description: Unauthenticated, because a load balancer has no bearer token to send.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [ops]
      operationId: getReadyz
      summary: Readiness probe
      description: >-
        Unauthenticated. 200 only when Postgres, Redis and its queue consumer
        group, and signerd are all reachable; otherwise 503 naming the
        dependency that is not.
      security: []
      responses:
        '200':
          description: Every dependency is reachable.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: A dependency is not reachable; the body names it.
          content:
            text/plain:
              schema:
                type: string
                example: postgres not reachable

  /metrics:
    get:
      tags: [ops]
      operationId: getMetrics
      summary: Prometheus metrics
      description: >-
        Per-tenant golden signals, with per-tool and per-model breakdowns, in
        Prometheus text format. Unauthenticated, like the probes.
      security: []
      responses:
        '200':
          description: The metrics.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A token from the configured issuer. It names the tenant and the user; a
        client never supplies either as a header.

  parameters:
    RunId:
      name: id
      in: path
      required: true
      description: A run id, which is its session id.
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  # Every error body is one line of plain text.
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: A missing or invalid `Authorization` header, or a token that is invalid or expired.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: The caller may not do this.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: There is no such thing in the caller's tenant.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: The current state refuses the operation.
      content:
        text/plain:
          schema:
            type: string
    PayloadTooLarge:
      description: The request body is over 4 MiB.
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: A failure the caller can do nothing about. The cause is in the server log, never in the body.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    CreateRunRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          minLength: 1
        data_label:
          type: string
          description: A routing hint. Empty or absent means the default.
          enum: [public, internal, confidential, restricted]
          x-go-type-skip-optional-pointer: true
        difficulty:
          type: string
          description: A routing hint. Empty or absent means the default.
          enum: [simple, complex]
          x-go-type-skip-optional-pointer: true
        autonomy:
          type: string
          description: The session's permission-chain autonomy level. Absent means `supervised`.
          enum: [read_only, supervised, autonomous]
          x-go-type-skip-optional-pointer: true
        budget_usd:
          type: string
          x-go-name: BudgetUSD
          description: >-
            A per-task hard ceiling in decimal USD, such as "0.05". A string and
            never a number: money is not a float. Absent means no session-level
            ceiling (a tenant ceiling, if configured, still applies).
          example: '0.05'
          x-go-type-skip-optional-pointer: true
        conversational:
          type: boolean
          description: >-
            A plain reply pauses the session awaiting the next message instead
            of ending the run, and `steer` continues it in place.
          x-go-type-skip-optional-pointer: true

    CreateRunResponse:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
          format: uuid

    Run:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
        terminal_reason:
          type: string
          description: Absent until the run settles.

    SessionSummary:
      type: object
      required: [run_id, status, created_at, autonomy_level]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
        terminal_reason:
          type: string
          description: Absent until the run settles.
        created_at:
          type: string
          format: date-time
        autonomy_level:
          type: string

    RunEvent:
      type: object
      description: The data of a durable event frame in a run's event stream.
      required: [event_id, seq, type, actor, created_at]
      properties:
        event_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: Strictly sequential within the session.
        type:
          type: string
          description: The event type, one of the closed taxonomy in `internal/eventlog`.
        actor:
          type: string
        tool_id:
          type: string
        pair_ref:
          type: string
          format: uuid
          description: On a `tool_result`, the `tool_use` event it answers.
        model_id:
          type: string
        created_at:
          type: string
          format: date-time
        body:
          type: object
          description: The decrypted payload; absent for a `thought` event.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true

    RunDelta:
      type: object
      description: >-
        One live, best-effort preview chunk. It is never durable and never
        replayed: the durable event it previews arrives right behind it.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [content, tool_use, reasoning]
        text:
          type: string
          description: For `content` only; never set for `reasoning`.
          x-go-type-skip-optional-pointer: true
        tool_use_id:
          type: string
          description: For `tool_use` only.
          x-go-type-skip-optional-pointer: true
        tool_name:
          type: string
          description: For `tool_use` only.
          x-go-type-skip-optional-pointer: true

    CancelRunRequest:
      type: object
      properties:
        reason:
          type: string
          x-go-type-skip-optional-pointer: true

    CancelRunResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: aborted

    SteerRunRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string

    SteerRunResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: steered

    TightenAutonomyRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          enum: [read_only, supervised, autonomous]

    TightenAutonomyResponse:
      type: object
      required: [status, autonomy_level]
      properties:
        status:
          type: string
          example: tightened
        autonomy_level:
          type: string

    ForkRunRequest:
      type: object
      required: [at_seq]
      properties:
        at_seq:
          type: integer
          format: int64
          description: Every run has an event at seq 1.
        model:
          type: string
          description: Overrides the model id. Absent or empty inherits the parent's.
          x-go-type-skip-optional-pointer: true

    ForkRunResponse:
      type: object
      required: [session_id, digest_diverged, parent_digest_hex, child_digest_hex]
      properties:
        session_id:
          type: string
          format: uuid
        digest_diverged:
          type: boolean
          description: >-
            True when the fork ran under different behaviour-determining config
            than its parent, so it is a candidate fix and not a reproduction of
            the original run.
        parent_digest_hex:
          type: string
        child_digest_hex:
          type: string

    Approval:
      type: object
      required: [approval_id, session_id, tool_id, ask_kind, status, context, expires_at, created_at]
      properties:
        approval_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        tool_id:
          type: string
        ask_kind:
          type: string
        status:
          type: string
          enum: [pending, granted, granted_modified, denied, expired, invalidated]
        context:
          type: object
          description: >-
            The decision-ready rendering (recipient, subject, attachment
            digests), never a bare id. Its shape belongs to the tool.
          x-go-type: json.RawMessage
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    GrantApprovalRequest:
      type: object
      properties:
        modified_input:
          type: object
          description: The tool's input object, as the approver substitutes it.
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true

    DenyApprovalRequest:
      type: object
