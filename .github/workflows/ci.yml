name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repository or the API.
permissions:
  contents: read

# A newer push to a PR supersedes the run in flight (integration and the eval
# gate are the expensive jobs). A push to main is never cancelled: every
# commit on main keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a `timeout-minutes`: without one a stalled job (a testcontainers
# start that never returns, a hung connection) runs to GitHub's 6-hour cap. Each
# limit is at least 2.5x the longest healthy run of its job across the last 60
# runs of this workflow (integration 419s, unit 137s, lint 107s, images 94s,
# build 71s, web 73s, govulncheck 47s, eval-gate 28s) and never under 5 minutes.
# Re-measure before tightening one. The `uses:` lines are pinned to a commit
# (a moved tag cannot change what CI runs); Dependabot keeps the pins current.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      # A dependency edit that left go.mod/go.sum untidy, or a module whose
      # content no longer matches its recorded hash, fails here rather than in
      # somebody else's `go mod tidy` diff.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: downloaded modules match go.sum
        run: go mod verify

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=integration

  # README task 13.10 (closing production-readiness finding F11): the
  # dependency tree (Docker client, pgx, OAuth libraries, ...) was entirely
  # unscanned — govulncheck is the Go-specific case, three lines to add.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -shuffle=on: a test that only passes in source order (shared package
      # state, a leftover env var) fails here instead of on someone's laptop. A
      # failing package prints its seed; reproduce with `-shuffle=<seed>`.
      # Packages that start goroutines also run goleak in a TestMain
      # (tests/contract/goleak_test.go makes that mandatory).
      - run: go test -race -shuffle=on -cover ./...

  # Uses testcontainers-go (Postgres + PgBouncer) rather than docker-compose
  # services, so the same test that spins up its own transaction-pooling
  # tier locally also runs unchanged here (README.md §7 — "the isolation
  # test must run through the same pooling tier production uses"). Runs
  # over ./... rather than a single directory: an integration-tagged test
  # can live white-box inside the package it tests (internal/store's
  # isolation test needs to call an unexported helper) or black-box under
  # tests/integration — both are picked up the same way.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -tags=integration ./...

  # The release gate (README.md §9): any prompt/tool/model/skill/plan/team
  # change must clear >=90% pass and zero regressions before merge. `make
  # eval` started enforcing in Phase 1 and hardened (k-trial Wilson
  # intervals, per-class policies, mandatory adversarial safety cases,
  # held-out gap, efficiency gating, baseline regression check) in Phase 10
  # (evals/cmd/runner, evals/testdata/baseline.json).
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make eval

  # The container images (the Dockerfile, deploy/docker-compose.yml's `app`
  # profile) are built by nothing else in CI, which is how the Dockerfile
  # stopped building when go.mod moved past the golang image's Go and nobody
  # noticed. Build both targets and check the two containers come up against
  # real infra and report ready: /readyz needs the migrations applied and
  # Postgres, Redis and signerd (over the shared socket volume) all reachable. No `needs:`, so a broken
  # image fails fast without waiting on the Go jobs.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose -f deploy/docker-compose.yml --profile app up -d --build
      # A fresh database has no application role or tables, so PgBouncer refuses
      # the app user (and /readyz stays 503) until the migrations have run.
      - name: apply the migrations
        run: docker compose -f deploy/docker-compose.yml --profile app run --rm nexusd migrate
      - name: nexusd reports ready
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8085/readyz && exit 0
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml --profile app ps
          docker compose -f deploy/docker-compose.yml --profile app logs nexusd signerd
          exit 1
      - if: always()
        run: docker compose -f deploy/docker-compose.yml --profile app down

  # The web app (README task 11.7, web/) is a standalone npm project that
  # talks to the existing REST API over HTTP — it needs nothing from the Go
  # build, so this job has no `needs:` on the Go jobs above.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
