name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --build-tags=integration

  unit:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -cover ./...

  # Uses testcontainers-go (Postgres + PgBouncer) rather than docker-compose
  # services, so the same test that spins up its own transaction-pooling
  # tier locally also runs unchanged here (README.md §7 — "the isolation
  # test must run through the same pooling tier production uses"). Runs
  # over ./... rather than a single directory: an integration-tagged test
  # can live white-box inside the package it tests (internal/store's
  # isolation test needs to call an unexported helper) or black-box under
  # tests/integration — both are picked up the same way.
  integration:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -tags=integration ./...

  # The release gate (README.md §9): any prompt/tool/model/skill/plan/team
  # change must clear >=90% pass and zero regressions before merge. `make
  # eval` started enforcing in Phase 1 and hardened (k-trial Wilson
  # intervals, per-class policies, mandatory adversarial safety cases,
  # held-out gap, efficiency gating, baseline regression check) in Phase 10
  # (evals/cmd/runner, evals/testdata/baseline.json).
  eval-gate:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make eval

  # The web app (README task 11.7, web/) is a standalone npm project that
  # talks to the existing REST API over HTTP — it needs nothing from the Go
  # build, so this job has no `needs:` on the Go jobs above.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
