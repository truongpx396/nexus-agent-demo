name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.5.0

  unit:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -cover ./...

  # Uses testcontainers-go (Postgres + PgBouncer) rather than docker-compose
  # services, so the same test that spins up its own transaction-pooling
  # tier locally also runs unchanged here (README.md §7 — "the isolation
  # test must run through the same pooling tier production uses").
  # Empty until Phase 1 lands tests/integration/*_test.go; a step over a
  # package with no Go files is a no-op, not a failure.
  integration:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -tags=integration ./tests/integration/...

  # The release gate (README.md §9): any prompt/tool/model/skill/plan change
  # must clear >=90% pass and zero regressions before merge. `make eval` is
  # a stub through Phase 0; it starts enforcing in Phase 1 and hardens
  # (trial statistics, suite classes, judge calibration) in Phase 9.
  eval-gate:
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make eval
