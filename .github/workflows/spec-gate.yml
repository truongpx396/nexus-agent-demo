name: spec-gate

# Its own workflow, like pr-size: it has to re-run when the `no-spec` label is
# added or removed, and ci.yml's integration and eval jobs are far too
# expensive to re-run on a label change.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: spec-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the script diffs against the merge base with the base
      # branch, which a shallow clone cannot compute.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The rule (which paths are behaviour-bearing) lives in
      # scripts/spec-gate.sh so `make spec-gate` agrees with this gate. The
      # `no-spec` label is the escape hatch for a change that genuinely needs
      # no spec (a comment-only edit, a rename the specs already describe); say
      # why in the PR description.
      - name: Check that behaviour changes come with a spec change
        env:
          BASE_REF: ${{ github.base_ref }}
          NO_SPEC: ${{ contains(github.event.pull_request.labels.*.name, 'no-spec') }}
        run: |
          set +e
          scripts/spec-gate.sh "origin/${BASE_REF}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            if [ "$NO_SPEC" = "true" ]; then
              echo "::warning::Behaviour-bearing code changed with no spec change, but the PR carries the no-spec label."
              exit 0
            fi
            echo "::error::Behaviour-bearing code changed and nothing under specs/ did. Add or check off a task in the relevant spec (see specs/README.md), or add the no-spec label and explain why in the description."
            exit 1
          fi
          exit "$rc"
