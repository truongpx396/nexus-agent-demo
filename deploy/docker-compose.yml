name: nexus-agent-demo

services:
  postgres:
    # pgvector/pgvector:pg17, not postgres:17: Phase 12 (README §5) adds the
    # pgvector extension back in (migrations/0022_retrieval.sql's `CREATE
    # EXTENSION vector`) — this image is a drop-in superset of the official
    # postgres:17 image with that extension pre-built in, nothing else
    # about the service changes.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      # Host port 5433, not 5432: this machine already runs an unrelated
      # postgres on 5432 for another project. The container's own port
      # stays 5432 — only the host mapping shifts.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-pooling PgBouncer sits between nexusd and Postgres. This is
  # not an optimization — it is what the tenant-isolation test in Phase 1
  # (README.md §5, task 1.4) runs against: RLS scoping must be
  # transaction-local (`set_config(..., true)`) precisely because a
  # transaction-pooling tier reassigns a physical connection between
  # tenants between statements. A test that only exercises a direct
  # connection to `postgres` proves nothing about the deployed topology.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432"

  redis:
    image: redis:7
    ports:
      # Host port 6380, not 6379: same reason as postgres above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- app (README task 13.3, F3) ---
  #
  # Not started by a bare `docker compose up` (the infra-only default this
  # file has always provided) — `docker compose --profile app up` builds
  # both binaries from the root Dockerfile and runs them against the same
  # postgres/pgbouncer/redis services above. Migrations/seeding are still a
  # separate step (`make migrate && make seed`, against the host-mapped
  # ports this file already exposes) — this profile only proves the image
  # builds and serves, not a full one-command bring-up.
  signerd:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: signerd
    volumes:
      - signerd-socket:/var/run/nexus
      - signerd-dev:/app/.dev
    environment:
      NEXUS_SIGNERD_SOCKET: /var/run/nexus/signerd.sock
      # 0.0.0.0, not 127.0.0.1 (unlike `make run`'s own host-process default,
      # docs/observability.md): a loopback bind INSIDE this container is
      # loopback to the CONTAINER, so the ports: mapping below could never
      # reach it — Docker's port NAT can't forward to a process that isn't
      # listening on that interface. The ports: mapping's OWN
      # "127.0.0.1:" host-side prefix is what keeps the actual exposure
      # loopback-only from the host's perspective, same posture as the
      # host-process path — nothing off this machine can reach either one.
      NEXUS_SIGNERD_PPROF_ADDR: 0.0.0.0:6061
      # See nexusd's own identical NEXUS_PYROSCOPE_ADDR comment below — same
      # host.docker.internal redirect, just this process's own application
      # name (StartPyroscope's own ApplicationName, set from os.Args/const
      # in cmd/signerd, tells the two apart in Pyroscope regardless).
      NEXUS_PYROSCOPE_ADDR: ${NEXUS_PYROSCOPE_ADDR:+http://host.docker.internal:4040}
    ports:
      - "127.0.0.1:6061:6061"

  nexusd:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: nexusd
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signerd:
        condition: service_started
    volumes:
      - signerd-socket:/var/run/nexus
      - nexusd-dev:/app/.dev
    environment:
      # Direct to postgres for admin operations (migrate is still run
      # separately, not by this service); through pgbouncer for the
      # runtime path, exactly like the host-side defaults in cmd/nexusd's
      # own consts, just naming the compose service instead of localhost.
      NEXUS_DATABASE_URL: postgres://nexus_app:nexus_app@pgbouncer:5432/nexus
      NEXUS_MIGRATE_DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      NEXUS_ADMIN_DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      NEXUS_REDIS_ADDR: redis:6379
      NEXUS_SIGNERD_SOCKET: /var/run/nexus/signerd.sock
      NEXUS_HTTP_ADDR: :8085
      # See signerd's own identical NEXUS_SIGNERD_PPROF_ADDR comment above —
      # same 0.0.0.0-inside/loopback-published pattern, just this
      # container's own port.
      NEXUS_PPROF_ADDR: 0.0.0.0:6060
      # Same "hardcode the container-correct address, ignore .env's own
      # host-side value" call as NEXUS_LITELLM_BASE_URL below, but Pyroscope
      # can't reuse litellm's container-DNS trick: it lives in the SEPARATE
      # nexus-agent-observability compose project (docker-compose.
      # observability.yml), a different default network with no shared
      # service name to resolve. host.docker.internal is Docker Desktop's
      # own host-loopback DNS name, reachable regardless of which compose
      # project is on the other end, since Pyroscope's `ports:` already
      # publishes 4040 to the host same as this repo's every other
      # container-to-host reach (docs/observability.md). The `${VAR:+...}`
      # form keeps this opt-in exactly like the host-process path: `.env`'s
      # own NEXUS_PYROSCOPE_ADDR unset/commented (.env.example's default)
      # resolves to an empty string here too, and obs.StartPyroscope's own
      # doc comment treats "" as disabled — so `make docker-up` stays
      # profiling-free until you uncomment NEXUS_PYROSCOPE_ADDR in `.env`
      # (`make profiling-up`'s own opt-in), same trigger as `make run`.
      NEXUS_PYROSCOPE_ADDR: ${NEXUS_PYROSCOPE_ADDR:+http://host.docker.internal:4040}
      # Provider selection reads your own repo-root .env (Makefile's
      # ENV_FILE_FLAG passes --env-file .env so this interpolation actually
      # resolves it — compose's own IMPLICIT .env lookup would otherwise
      # check deploy/.env, next to this file, which doesn't exist), so
      # `NEXUS_PROVIDER=litellm` in .env Just Works here too without
      # editing this file — defaults to fake (this profile's original,
      # zero-network-dependency behavior) when unset. NEXUS_LITELLM_BASE_URL
      # is hardcoded, NOT sourced from .env's own NEXUS_LITELLM_BASE_URL
      # (http://localhost:4100, correct for a HOST process reaching
      # litellm's published port) — from inside this container, localhost
      # is this container, not the host; litellm:4000 is its container-DNS
      # name and internal port, reachable because docker-compose.local-
      # llm.yml shares this same project name and therefore this same
      # default network (that file's own header comment already notes this
      # network sharing exists, even though it doesn't rely on it — this is
      # the one path in this repo that now does).
      NEXUS_PROVIDER: ${NEXUS_PROVIDER:-fake}
      NEXUS_LITELLM_BASE_URL: http://litellm:4000
      NEXUS_LITELLM_MODEL: ${NEXUS_LITELLM_MODEL:-qwen2.5-local}
      NEXUS_LITELLM_API_KEY: ${NEXUS_LITELLM_API_KEY:-}
    ports:
      - "8085:8085"
      - "127.0.0.1:6060:6060"
    # --dev keeps this profile a one-command demo (auto-generated KEK/AuthN
    # keys, persisted in the nexusd-dev volume across restarts) — a real
    # deployment omits it and mounts real secrets instead (README task
    # 13.1/13.11).
    command: ["--dev"]

volumes:
  postgres-data:
  signerd-socket:
  signerd-dev:
  nexusd-dev:
