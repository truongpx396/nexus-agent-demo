name: nexus-agent-demo

services:
  postgres:
    # pgvector/pgvector:pg17, not postgres:17: Phase 12 (README §5) adds the
    # pgvector extension back in (migrations/0022_retrieval.sql's `CREATE
    # EXTENSION vector`) — this image is a drop-in superset of the official
    # postgres:17 image with that extension pre-built in, nothing else
    # about the service changes.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      # Host port 5433, not 5432: this machine already runs an unrelated
      # postgres on 5432 for another project. The container's own port
      # stays 5432 — only the host mapping shifts.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Transaction-pooling PgBouncer sits between nexusd and Postgres. This is
  # not an optimization — it is what the tenant-isolation test in Phase 1
  # (README.md §5, task 1.4) runs against: RLS scoping must be
  # transaction-local (`set_config(..., true)`) precisely because a
  # transaction-pooling tier reassigns a physical connection between
  # tenants between statements. A test that only exercises a direct
  # connection to `postgres` proves nothing about the deployed topology.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432"

  redis:
    image: redis:7
    ports:
      # Host port 6380, not 6379: same reason as postgres above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- app (README task 13.3, F3) ---
  #
  # Not started by a bare `docker compose up` (the infra-only default this
  # file has always provided) — `docker compose --profile app up` builds
  # both binaries from the root Dockerfile and runs them against the same
  # postgres/pgbouncer/redis services above. Migrations/seeding are still a
  # separate step (`make migrate && make seed`, against the host-mapped
  # ports this file already exposes) — this profile only proves the image
  # builds and serves, not a full one-command bring-up.
  signerd:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: signerd
    volumes:
      - signerd-socket:/var/run/nexus
      - signerd-dev:/app/.dev
    environment:
      NEXUS_SIGNERD_SOCKET: /var/run/nexus/signerd.sock

  nexusd:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
      target: nexusd
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      signerd:
        condition: service_started
    volumes:
      - signerd-socket:/var/run/nexus
      - nexusd-dev:/app/.dev
    environment:
      # Direct to postgres for admin operations (migrate is still run
      # separately, not by this service); through pgbouncer for the
      # runtime path, exactly like the host-side defaults in cmd/nexusd's
      # own consts, just naming the compose service instead of localhost.
      NEXUS_DATABASE_URL: postgres://nexus_app:nexus_app@pgbouncer:5432/nexus
      NEXUS_MIGRATE_DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      NEXUS_ADMIN_DATABASE_URL: postgres://nexus:nexus@postgres:5432/nexus
      NEXUS_REDIS_ADDR: redis:6379
      NEXUS_SIGNERD_SOCKET: /var/run/nexus/signerd.sock
      NEXUS_HTTP_ADDR: :8085
    ports:
      - "8085:8085"
    # --dev keeps this profile a one-command demo (auto-generated KEK/AuthN
    # keys, persisted in the nexusd-dev volume across restarts) — a real
    # deployment omits it and mounts real secrets instead (README task
    # 13.1/13.11).
    command: ["--dev"]

volumes:
  postgres-data:
  signerd-socket:
  signerd-dev:
  nexusd-dev:
