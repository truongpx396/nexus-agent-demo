# Ships logs into Loki (docs/observability.md), two ways — one job each:
#
# `nexus`: reads *.log under /var/log/nexus — docker-compose.observability.yml
# bind-mounts this repo's own .dev/ directory there, read-only, which is
# where internal/obs.InitLogger writes when NEXUS_LOG_FILE is set (the
# Makefile's run/signerd targets set it by default: .dev/nexusd.log,
# .dev/signerd.log) — covers nexusd/signerd run as plain host processes
# (`make run`).
#
# `docker` (task 17.13): Docker service discovery over the socket
# docker-compose.observability.yml's promtail service mounts, filtered to
# the APP stack's containers via the `com.docker.compose.project` label
# Docker Compose sets on everything it creates — deliberately
# `nexus-agent-demo` (docker-compose.yml's/docker-compose.local-llm.yml's
# own project name), NOT this file's own project
# (`nexus-agent-observability`, a separate Docker Desktop group on
# purpose — docker-compose.observability.yml's own header comment says why):
# this job exists to tail the app's logs, not this stack's own — covers
# nexusd/signerd run as containers (`make docker-up`, the path needed for
# cAdvisor's own per-container resource metrics to mean anything for them
# specifically), plus postgres/pgbouncer/redis and anything else from the
# app project that happens to be up.
#
# Both feed the same low-cardinality-label discipline: every line is
# zerolog JSON for nexusd/signerd (`level`/`time`/`message`, zerolog's own
# field names) — pipeline_stages promote just `level` to a Loki label
# (cheap, exactly what Loki's own docs recommend labels be for) and leave
# everything else in the log line itself, the same discipline
# internal/obs/allowlist.go applies to span attributes for a different
# reason (content, not cardinality) but converges on the same shape. A
# non-JSON line (postgres/redis/pgbouncer, on the `docker` job) just skips
# the `level` label — it still ships and is still searchable by its raw
# text.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nexus
    static_configs:
      - targets: ["localhost"]
        labels:
          job: nexus
          __path__: /var/log/nexus/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=nexus-agent-demo"]
    relabel_configs:
      - target_label: job
        replacement: docker
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
